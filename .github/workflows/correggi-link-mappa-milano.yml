name: Correggi link mappa Milano

on:
  push:
    paths:
      - ".github/workflows/correggi-link-mappa-milano.yml"

permissions:
  contents: write

jobs:
  aggiorna-link:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collega la sede di Milano alla scheda corretta
        run: |
          python - <<'PY'
          from pathlib import Path

          vecchio = "https://www.google.com/maps/search/?api=1&query=Piazzetta%20Guastalla%2015%2C%2020122%20Milano%20MI%2C%20Italia"
          nuovo = "https://www.google.com/maps/search/?api=1&query=Studio%20Legale%20Casarotti%2C%20Cascasi%20e%20Ciavarella%2C%20Piazzetta%20Guastalla%2015%2C%2020122%20Milano%20MI"

          files = [Path("contenuti.json"), Path("contatti.html")]
          changed = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              updated = text.replace(vecchio, nuovo)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.as_posix())

          print("File aggiornati:", ", ".join(changed) if changed else "nessuno")
          PY

      - name: Salva le modifiche
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contenuti.json contatti.html
          git commit -m "Collega la sede di Milano alla scheda Google Maps corretta"
          git push
