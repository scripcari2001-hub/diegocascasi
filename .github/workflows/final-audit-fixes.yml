name: Correzioni finali pre-pubblicazione

on:
  push:
    paths:
      - ".github/workflows/final-audit-fixes.yml"

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Applica le correzioni finali
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          DOMAIN = "https://studiolegalecascasibianchi.it"

          pages = {
              "index.html": f"{DOMAIN}/",
              "chi-siamo.html": f"{DOMAIN}/chi-siamo.html",
              "aree.html": f"{DOMAIN}/aree.html",
              "contatti.html": f"{DOMAIN}/contatti.html",
              "privacy.html": f"{DOMAIN}/privacy.html",
              "cookie.html": f"{DOMAIN}/cookie.html",
          }

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"Testo atteso non trovato in {label}: {old[:100]}")
              return text.replace(old, new)

          # Metadati SEO e referrer coerenti con il dominio definitivo.
          for filename, canonical in pages.items():
              text = read(filename)
              if 'name="referrer"' not in text:
                  marker = re.search(r'  <meta name="robots"[^>]*>\n', text)
                  if not marker:
                      raise SystemExit(f"Meta robots non trovato in {filename}")
                  block = (
                      marker.group(0)
                      + '  <meta name="referrer" content="strict-origin-when-cross-origin">\n'
                      + f'  <link rel="canonical" href="{canonical}">\n'
                      + f'  <meta property="og:url" content="{canonical}">\n'
                  )
                  text = text[:marker.start()] + block + text[marker.end():]
              write(filename, text)

          # Modulo: validazione nativa di riserva, codifica e honeypot antispam.
          text = read("contatti.html")
          text = replace_required(
              text,
              '<form class="contact-form" id="contactForm" action="https://formspree.io/f/mjgelvek" method="POST" novalidate>',
              '<form class="contact-form" id="contactForm" action="https://formspree.io/f/mjgelvek" method="POST" accept-charset="UTF-8">',
              "contatti.html form",
          )
          text = replace_required(
              text,
              '    @media(max-width:760px){#contactForm{scroll-margin-top:110px}}',
              '    @media(max-width:760px){#contactForm{scroll-margin-top:110px}}\n    .form-trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;opacity:0}',
              "contatti.html style",
          )
          text = replace_required(
              text,
              '          <input type="hidden" name="_subject" value="Nuova richiesta di appuntamento dal sito">',
              '          <input type="hidden" name="_subject" value="Nuova richiesta di appuntamento dal sito">\n          <div class="form-trap" aria-hidden="true"><label for="website">Non compilare questo campo</label><input type="text" id="website" name="_gotcha" tabindex="-1" autocomplete="off"></div>',
              "contatti.html honeypot",
          )
          write("contatti.html", text)

          # La scheda senza fotografia deve apparire intenzionale, non incompleta.
          text = read("chi-siamo.html")
          text = text.replace('              <small>Foto da inserire</small>\n', '')
          write("chi-siamo.html", text)

          # JavaScript: messaggio privacy corretto, FAQ più robusta e nota completa non sovrascritta.
          text = read("script.js")
          text = replace_required(
              text,
              'showFieldError(field, field.type === "checkbox" ? "Devi accettare la Privacy Policy." : "Compila questo campo.");',
              'showFieldError(field, field.type === "checkbox" ? "Devi confermare di aver letto la Privacy Policy." : "Compila questo campo.");',
              "script.js privacy validation",
          )
          text = replace_required(
              text,
              '      const button = qs(".faq-question", item);\n      const icon = qs("span", button);\n      if (button) {\n        button.replaceChildren(document.createTextNode(faq.domanda));',
              '      const button = qs(".faq-question", item);\n      if (button) {\n        const icon = qs("span", button);\n        button.replaceChildren(document.createTextNode(faq.domanda));',
              "script.js FAQ",
          )
          text = replace_required(
              text,
              '    setText(".form-note", contacts.formNota);',
              '    const formNote = qs(".form-note");\n    if (formNote && contacts.formNota && contacts.formNota.length > formNote.textContent.length) {\n      formNote.textContent = contacts.formNota;\n    }',
              "script.js form note",
          )
          text = replace_required(
              text,
              '        const caption = document.createElement("small");\n        caption.textContent = "Foto da inserire";\n        photo.append(initials, caption);',
              '        photo.append(initials);',
              "script.js photo placeholder",
          )
          write("script.js", text)

          # Mantiene la nota estesa anche nei contenuti dinamici.
          text = read("contenuti.json")
          text = replace_required(
              text,
              '"formNota": "* Campi obbligatori. I dati sono trattati secondo quanto indicato nella Privacy Policy."',
              '"formNota": "* Campi obbligatori. I dati sono trattati secondo quanto indicato nella Privacy Policy. Nel primo messaggio evita di inserire dati particolari, giudiziari o documenti non necessari."',
              "contenuti.json formNota",
          )
          write("contenuti.json", text)

          # Privacy Policy: dominio definitivo, titolari espliciti e controlli antispam descritti.
          text = read("privacy.html")
          text = replace_required(
              text,
              'Ultimo aggiornamento: 29 luglio 2026 · Versione 1.4',
              'Ultimo aggiornamento: 30 luglio 2026 · Versione 1.5',
              "privacy.html data",
          )
          text = replace_required(
              text,
              '<h2>1. Ambito dell’informativa e soggetti di riferimento</h2>',
              '<h2>1. Titolari del trattamento e ambito dell’informativa</h2>',
              "privacy.html titolo",
          )
          text = replace_required(
              text,
              'Questa informativa descrive i trattamenti di dati personali connessi alla consultazione del sito e all’invio di richieste tramite il modulo di contatto, email o PEC. Il sito è riferito allo <strong>Studio Legale Cascasi &amp; Bianchi</strong>. Le richieste sono trattate dall’Avv. Diego Cascasi e/o dall’Avv. Cristina Bianchi in base al destinatario, alla materia indicata e al professionista che prende in carico il contatto.',
              'Questa informativa descrive i trattamenti di dati personali connessi alla consultazione del sito <strong>studiolegalecascasibianchi.it</strong> e all’invio di richieste tramite il modulo di contatto, email o PEC. I titolari del trattamento, per quanto di rispettiva competenza, sono l’Avv. Diego Cascasi e l’Avv. Cristina Bianchi. Il professionista destinatario o che prende in carico la richiesta tratta i dati per rispondere e valutare l’eventuale incarico; le richieste indirizzate genericamente allo Studio vengono assegnate in base alla materia e all’organizzazione interna.',
              "privacy.html titolari",
          )
          text = replace_required(
              text,
              '<li><strong>Formspree:</strong> gestisce l’invio del modulo. Al momento dell’invio riceve i dati inseriti, li rende disponibili nell’account configurato e inoltra la relativa notifica. È possibile consultare la <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy Policy di Formspree</a>.</li>',
              '<li><strong>Formspree:</strong> gestisce l’invio del modulo. Al momento dell’invio riceve i dati inseriti, li rende disponibili nell’account configurato e inoltra la relativa notifica. In base alla configurazione del modulo può applicare controlli antispam e mostrare un CAPTCHA durante l’invio. È possibile consultare la <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy Policy di Formspree</a>.</li>',
              "privacy.html Formspree",
          )
          write("privacy.html", text)

          # Cookie Policy coerente con il funzionamento effettivo del modulo.
          text = read("cookie.html")
          text = replace_required(
              text,
              'Ultimo aggiornamento: 29 luglio 2026 · Versione 1.4',
              'Ultimo aggiornamento: 30 luglio 2026 · Versione 1.5',
              "cookie.html data",
          )
          text = replace_required(
              text,
              '<li><strong>Formspree:</strong> non viene caricato come strumento di tracciamento durante la normale navigazione. Il servizio viene contattato soltanto quando l’utente invia il modulo; in quel momento riceve i dati inseriti e i dati tecnici necessari a gestire la richiesta. È possibile consultare la <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy Policy di Formspree</a>.</li>',
              '<li><strong>Formspree:</strong> non viene caricato come strumento di tracciamento durante la normale navigazione. Il servizio viene contattato soltanto quando l’utente invia il modulo; in quel momento riceve i dati inseriti e i dati tecnici necessari a gestire la richiesta. Se la protezione CAPTCHA è abilitata, durante l’invio può essere mostrato un controllo antispam gestito da Formspree e dal relativo fornitore; tale controllo non viene caricato durante la semplice consultazione delle pagine. È possibile consultare la <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer">Privacy Policy di Formspree</a>.</li>',
              "cookie.html Formspree",
          )
          write("cookie.html", text)

          # Indicizzazione sul dominio definitivo.
          write("robots.txt", "User-agent: *\nAllow: /\n\nSitemap: https://studiolegalecascasibianchi.it/sitemap.xml\n")
          write(
              "sitemap.xml",
              '''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://studiolegalecascasibianchi.it/</loc><lastmod>2026-07-30</lastmod></url>
            <url><loc>https://studiolegalecascasibianchi.it/chi-siamo.html</loc><lastmod>2026-07-30</lastmod></url>
            <url><loc>https://studiolegalecascasibianchi.it/aree.html</loc><lastmod>2026-07-30</lastmod></url>
            <url><loc>https://studiolegalecascasibianchi.it/contatti.html</loc><lastmod>2026-07-30</lastmod></url>
          </urlset>
          ''',
          )
          PY

      - name: Controlla codice, collegamenti e contenuti
        shell: bash
        run: |
          node --check script.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import json
          import xml.etree.ElementTree as ET

          html_files = [Path(p) for p in ["index.html", "chi-siamo.html", "aree.html", "contatti.html", "privacy.html", "cookie.html"]]
          json.load(open("contenuti.json", encoding="utf-8"))
          ET.parse("sitemap.xml")

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.refs = []
                  self.canonical = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  for key in ("href", "src"):
                      if key in attrs:
                          self.refs.append(attrs[key])
                  if tag == "link" and attrs.get("rel") == "canonical":
                      self.canonical.append(attrs.get("href", ""))

          parsed = {}
          for path in html_files:
              parser = AuditParser()
              parser.feed(path.read_text(encoding="utf-8"))
              if len(parser.ids) != len(set(parser.ids)):
                  raise SystemExit(f"ID duplicati in {path}")
              if len(parser.canonical) != 1:
                  raise SystemExit(f"Canonical mancante o duplicata in {path}")
              parsed[path.name] = parser

          for path in html_files:
              parser = parsed[path.name]
              for ref in parser.refs:
                  if not ref or ref.startswith(("http://", "https://", "mailto:", "tel:", "data:", "#")):
                      continue
                  clean = urlsplit(ref).path
                  if not clean:
                      continue
                  target = Path(clean)
                  if not target.exists():
                      raise SystemExit(f"Risorsa locale mancante in {path}: {ref}")

          all_text = "\n".join(p.read_text(encoding="utf-8") for p in html_files + [Path("contenuti.json"), Path("robots.txt"), Path("sitemap.xml")])
          if "Via Donati" in all_text:
              raise SystemExit("È rimasto il vecchio indirizzo Via Donati")
          if "scripcari2001-hub.github.io/diegocascasi" in all_text:
              raise SystemExit("È rimasto il vecchio URL GitHub Pages")
          if Path("CNAME").read_text(encoding="utf-8").strip() != "studiolegalecascasibianchi.it":
              raise SystemExit("CNAME non corretto")
          if "Foto da inserire" in all_text or "Foto da inserire" in Path("script.js").read_text(encoding="utf-8"):
              raise SystemExit("È rimasto un segnaposto non definitivo")

          print("Controlli completati con esito positivo")
          PY

      - name: Salva le correzioni
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chi-siamo.html aree.html contatti.html privacy.html cookie.html script.js contenuti.json robots.txt sitemap.xml
          git commit -m "Completa il controllo finale prima della pubblicazione"
          git push
