name: Correggi indirizzo Milano

on:
  push:
    paths:
      - '.github/workflows/fix-milano-address.yml'

permissions:
  contents: write

jobs:
  fix-address:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Sostituisci l'indirizzo errato
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('chi-siamo.html'),
              Path('aree.html'),
              Path('contatti.html'),
              Path('privacy.html'),
              Path('cookie.html'),
              Path('contenuti.json'),
          ]

          replacements = {
              'Via Donati 6, 20146 Milano': 'Piazzetta Guastalla 15, 20122 Milano',
              'Via Donati 6': 'Piazzetta Guastalla 15',
              'Via+Donati+6+Milano': 'Piazzetta+Guastalla+15+Milano',
          }

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          remaining = []
          for path in files:
              if 'Via Donati' in path.read_text(encoding='utf-8'):
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'Indirizzo errato ancora presente in: {remaining}')

          print('File corretti:', ', '.join(changed))
          PY

      - name: Salva le correzioni
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chi-siamo.html aree.html contatti.html privacy.html cookie.html contenuti.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria"
          else
            git commit -m "Corregge la sede di Milano in Piazzetta Guastalla 15"
            git push
          fi