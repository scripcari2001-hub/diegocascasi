name: Fix mobile contact bar

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-contact-bar.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append mobile fix
        shell: bash
        run: |
          if ! grep -q 'Stabilizzazione barra contatti mobile' style.css; then
            cat >> style.css <<'EOF'

/* Stabilizzazione barra contatti mobile */
@media (max-width:760px) {
  body {
    padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px));
  }
  .mobile-contact-bar {
    position: fixed !important;
    top: auto !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;
    width: 100% !important;
    min-height: 0;
    height: calc(62px + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translate3d(0,0,0);
    -webkit-transform: translate3d(0,0,0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
    isolation: isolate;
  }
  .mobile-contact-bar a {
    height: 62px;
  }
}
EOF
          fi
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git commit -m 'Stabilizza la barra contatti su mobile'
          git push