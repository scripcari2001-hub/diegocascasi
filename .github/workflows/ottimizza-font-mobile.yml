name: Ottimizza caricamento font mobile

on:
  push:
    paths:
      - ".github/workflows/ottimizza-font-mobile.yml"

permissions:
  contents: write

jobs:
  optimize-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Rende non bloccanti i Google Fonts
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Jost:wght@300;400;500;600&amp;display=swap">'
          href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Jost:wght@300;400;500;600&amp;display=swap'
          new = f'<link rel="preload" as="style" href="{href}" onload="this.onload=null;this.rel=\'stylesheet\'">\n  <noscript><link rel="stylesheet" href="{href}"></noscript>'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(path.as_posix())

          print('File aggiornati:', ', '.join(changed))
          PY

      - name: Salva le modifiche
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Ottimizza il caricamento dei font su mobile"
          git push
