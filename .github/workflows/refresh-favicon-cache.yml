name: Aggiorna cache favicon

on:
  push:
    paths:
      - ".github/workflows/refresh-favicon-cache.yml"

permissions:
  contents: write

jobs:
  refresh-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna i riferimenti alla favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          versioned = '/logo.icon.png?v=20260730-5'
          paths = list(Path('.').glob('*.html')) + list(Path('admin').glob('*.html'))
          changed = []

          for path in paths:
              text = path.read_text(encoding='utf-8')
              updated = re.sub(
                  r'<link\s+rel="icon"[^>]*>',
                  f'<link rel="icon" type="image/png" href="{versioned}">\n  <link rel="shortcut icon" href="{versioned}">',
                  text,
                  count=1,
                  flags=re.IGNORECASE,
              )
              if path.as_posix() == 'admin/index.html' and updated == text:
                  updated = text.replace(
                      '<title>Gestione contenuti – Studio Legale Cascasi &amp; Bianchi</title>',
                      f'<title>Gestione contenuti – Studio Legale Cascasi &amp; Bianchi</title>\n  <link rel="icon" type="image/png" href="{versioned}">\n  <link rel="shortcut icon" href="{versioned}">'
                  )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print('File aggiornati:', ', '.join(changed))
          PY

      - name: Salva le modifiche
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'admin/*.html'
          git commit -m "Forza l'aggiornamento della favicon su tutte le pagine"
          git push
