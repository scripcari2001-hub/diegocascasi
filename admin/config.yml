backend:
  name: git-gateway
  repo: scripcari2001-hub/diegocascasi
  branch: main
  identity_url: https://auth.decapbridge.com/sites/388e5fc0-dff1-468d-ab02-2eb67fc887dd
  gateway_url: https://gateway.decapbridge.com

publish_mode: simple
locale: it
site_url: https://scripcari2001-hub.github.io/diegocascasi/
display_url: https://scripcari2001-hub.github.io/diegocascasi/
media_folder: "uploads"
public_folder: "/diegocascasi/uploads"

editor:
  preview: false

collections:
  - name: contenuti
    label: Contenuti del sito
    files:
      - name: testi_sito
        label: Modifica testi del sito
        file: contenuti.json
        format: json
        fields:
          - label: Dati generali dello Studio
            name: studio
            widget: object
            collapsed: false
            fields:
              - { label: Nome dello Studio, name: nome, widget: string }
              - { label: Sottotitolo, name: sottoTitolo, widget: string }
              - { label: Descrizione generale, name: descrizione, widget: text }
              - { label: Informazione sul ricevimento, name: ricevimento, widget: string }

          - label: Menu
            name: nav
            widget: object
            collapsed: true
            fields:
              - { label: Home, name: home, widget: string }
              - { label: Lo Studio, name: chiSiamo, widget: string }
              - { label: Aree di attività, name: aree, widget: string }
              - { label: Contatti, name: contatti, widget: string }
              - { label: Pulsante appuntamento, name: appuntamento, widget: string }

          - label: Professionisti
            name: professionisti
            widget: list
            collapsed: false
            min: 2
            max: 2
            summary: "{{fields.nome}}"
            fields:
              - { label: Identificativo tecnico, name: id, widget: string, hint: "Non modificare salvo necessità tecnica." }
              - { label: Nome, name: nome, widget: string }
              - { label: Iniziali, name: iniziali, widget: string }
              - { label: Iscrizione all'Albo, name: albo, widget: string }
              - { label: Nome della sede, name: sedeNome, widget: string }
              - { label: Indirizzo, name: indirizzo, widget: string }
              - { label: Link Google Maps, name: mappaLink, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: PEC, name: pec, widget: string }
              - { label: Foto, name: foto, widget: image, required: false }
              - { label: Testo alternativo foto, name: fotoAlt, widget: string }
              - label: Paragrafi della presentazione
                name: paragrafi
                widget: list
                field: { label: Paragrafo, name: paragrafo, widget: text }

          - label: Homepage
            name: home
            widget: object
            collapsed: false
            fields:
              - { label: Testo piccolo sopra il titolo, name: heroOcchio, widget: string }
              - { label: Titolo principale, name: heroTitolo, widget: string }
              - { label: Parola evidenziata, name: heroTitoloEm, widget: string }
              - { label: Sottotitolo, name: heroSottotitolo, widget: text }
              - { label: Pulsante principale, name: heroBtnPrimario, widget: string }
              - { label: Pulsante secondario, name: heroBtnSecondario, widget: string }
              - { label: Etichetta sezione attività, name: sezioneOcchio, widget: string }
              - { label: Titolo sezione attività, name: sezioneTitolo, widget: string }
              - label: Riquadri attività
                name: cards
                widget: list
                min: 3
                max: 3
                summary: "{{fields.titolo}}"
                fields:
                  - { label: Titolo, name: titolo, widget: string }
                  - { label: Testo, name: testo, widget: text }
                  - { label: Link, name: link, widget: string }
                  - { label: Testo del link, name: linkTesto, widget: string }
              - { label: Etichetta motivi, name: motiviOcchio, widget: string }
              - { label: Titolo motivi, name: motiviTitolo, widget: string }
              - { label: Titolo fascia finale, name: ctaTitolo, widget: string }
              - { label: Testo fascia finale, name: ctaSottotitolo, widget: text }
              - { label: Pulsante fascia finale, name: ctaBottone, widget: string }

          - label: Pagina Lo Studio
            name: chiSiamo
            widget: object
            collapsed: true
            fields:
              - { label: Testo piccolo sopra il titolo, name: heroOcchio, widget: string }
              - { label: Titolo principale, name: heroTitolo, widget: string }
              - { label: Sottotitolo principale, name: heroSottotitolo, widget: text }
              - { label: Etichetta professionisti, name: sezioneOcchio, widget: string }
              - { label: Titolo professionisti, name: sezioneTitolo, widget: string }
              - { label: Introduzione professionisti, name: sezioneSottotitolo, widget: text }
              - { label: Etichetta metodo, name: valoriOcchio, widget: string }
              - { label: Titolo metodo, name: valoriTitolo, widget: string }
              - label: Valori
                name: valori
                widget: list
                min: 3
                max: 3
                summary: "{{fields.titolo}}"
                fields:
                  - { label: Titolo, name: titolo, widget: string }
                  - { label: Testo, name: testo, widget: text }
              - { label: Titolo fascia finale, name: ctaTitolo, widget: string }
              - { label: Testo fascia finale, name: ctaSottotitolo, widget: text }
              - { label: Pulsante fascia finale, name: ctaBottone, widget: string }

          - label: Pagina Aree di attività
            name: aree
            widget: object
            collapsed: true
            fields:
              - { label: Testo piccolo sopra il titolo, name: heroOcchio, widget: string }
              - { label: Titolo principale, name: heroTitolo, widget: string }
              - { label: Sottotitolo principale, name: heroSottotitolo, widget: text }
              - { label: Titolo indice, name: indiceTitolo, widget: string }
              - label: Aree
                name: specializzazioni
                widget: list
                summary: "{{fields.numero}} - {{fields.titolo}}"
                fields:
                  - { label: Numero, name: numero, widget: string }
                  - { label: Identificativo tecnico, name: id, widget: string, hint: "Usare lettere minuscole e trattini, senza spazi." }
                  - { label: Titolo, name: titolo, widget: string }
                  - { label: Testo, name: testo, widget: text }
                  - label: Voci
                    name: voci
                    widget: list
                    field: { label: Voce, name: voce, widget: string }
              - { label: Etichetta assistenza, name: attivitaOcchio, widget: string }
              - { label: Titolo assistenza, name: attivitaTitolo, widget: string }
              - label: Elenco assistenza
                name: attivita
                widget: list
                field: { label: Attività, name: attivita, widget: string }
              - { label: Titolo riquadro professionisti, name: ctaBoxTitolo, widget: string }
              - { label: Testo riquadro professionisti, name: ctaBoxTesto, widget: text }
              - { label: Pulsante riquadro, name: ctaBoxBottone, widget: string }
              - { label: Titolo fascia finale, name: ctaTitolo, widget: string }
              - { label: Testo fascia finale, name: ctaSottotitolo, widget: text }
              - { label: Pulsante fascia finale, name: ctaBottone, widget: string }

          - label: Pagina Contatti
            name: contatti
            widget: object
            collapsed: true
            fields:
              - { label: Testo piccolo sopra il titolo, name: heroOcchio, widget: string }
              - { label: Titolo principale, name: heroTitolo, widget: string }
              - { label: Sottotitolo principale, name: heroSottotitolo, widget: text }
              - { label: Etichetta sedi, name: infoOcchio, widget: string }
              - { label: Titolo sedi, name: infoTitolo, widget: string }
              - { label: Titolo avviso appuntamento, name: avvisoTitolo, widget: string }
              - { label: Testo avviso appuntamento, name: avvisoTesto, widget: text }
              - { label: Etichetta modulo, name: formOcchio, widget: string }
              - { label: Titolo modulo, name: formTitolo, widget: string }
              - { label: Introduzione modulo, name: formSottotitolo, widget: text }
              - { label: Etichetta nome, name: formLabelNome, widget: string }
              - { label: Etichetta cognome, name: formLabelCognome, widget: string }
              - { label: Etichetta email, name: formLabelEmail, widget: string }
              - { label: Etichetta area, name: formLabelOggetto, widget: string }
              - { label: Etichetta messaggio, name: formLabelMessaggio, widget: string }
              - { label: Esempio nome, name: formPlaceholderNome, widget: string }
              - { label: Esempio cognome, name: formPlaceholderCognome, widget: string }
              - { label: Esempio email, name: formPlaceholderEmail, widget: string }
              - { label: Testo iniziale area, name: formPlaceholderOggetto, widget: string }
              - { label: Esempio messaggio, name: formPlaceholderMessaggio, widget: text }
              - label: Opzioni area
                name: formOpzioni
                widget: list
                summary: "{{fields.testo}}"
                fields:
                  - { label: Valore tecnico, name: value, widget: string }
                  - { label: Testo visibile, name: testo, widget: string }
              - { label: Testo consenso privacy, name: formPrivacy, widget: string }
              - { label: Testo link privacy, name: formPrivacyLink, widget: string }
              - { label: Pulsante invio, name: formBottone, widget: string }
              - { label: Testo durante invio, name: formBottoneInvio, widget: string }
              - { label: Nota modulo, name: formNota, widget: text }
              - { label: Titolo conferma, name: successTitolo, widget: string }
              - { label: Testo conferma, name: successTesto, widget: text }
              - { label: Etichetta FAQ, name: faqOcchio, widget: string }
              - { label: Titolo FAQ, name: faqTitolo, widget: string }
              - label: Domande frequenti
                name: faq
                widget: list
                summary: "{{fields.domanda}}"
                fields:
                  - { label: Domanda, name: domanda, widget: string }
                  - { label: Risposta, name: risposta, widget: text }

          - label: Footer
            name: footer
            widget: object
            collapsed: true
            fields:
              - { label: Descrizione, name: descrizione, widget: text }
              - { label: Titolo navigazione, name: navTitolo, widget: string }
              - { label: Titolo email, name: contattiTitolo, widget: string }
              - { label: Titolo sedi, name: sediTitolo, widget: string }
              - { label: Titolo legale, name: legaleTitolo, widget: string }
              - { label: Testo link privacy, name: privacyLink, widget: string }
              - { label: Testo link cookie, name: cookieLink, widget: string }
              - { label: Copyright, name: copyright, widget: string }

          - label: Informativa cookie
            name: cookieBanner
            widget: object
            collapsed: true
            fields:
              - { label: Testo, name: testo, widget: text }
              - { label: Testo link, name: linkTesto, widget: string }
              - { label: Testo pulsante, name: bottone, widget: string }
