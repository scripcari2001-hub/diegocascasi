<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestione contenuti – Studio Legale Cascasi &amp; Bianchi</title>
</head>
<body>
  <noscript>Per usare il pannello di gestione devi attivare JavaScript.</noscript>
  <script>
    /* Compatibilità per browser meno recenti e accesso temporaneo senza HTTPS. */
    (() => {
      const cryptoObject = globalThis.crypto || (globalThis.crypto = {});
      if (typeof cryptoObject.randomUUID === "function") return;

      cryptoObject.randomUUID = () => {
        const bytes = new Uint8Array(16);
        if (typeof cryptoObject.getRandomValues === "function") {
          cryptoObject.getRandomValues(bytes);
        } else {
          for (let index = 0; index < bytes.length; index += 1) {
            bytes[index] = Math.floor(Math.random() * 256);
          }
        }
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = [...bytes].map(value => value.toString(16).padStart(2, "0"));
        return `${hex.slice(0, 4).join("")}-${hex.slice(4, 6).join("")}-${hex.slice(6, 8).join("")}-${hex.slice(8, 10).join("")}-${hex.slice(10, 16).join("")}`;
      };
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
